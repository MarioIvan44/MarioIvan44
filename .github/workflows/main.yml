name: Waka Readme

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README
    runs-on: ubuntu-latest

    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_TITLE: "True"
          SECTION_NAME: "waka"
          SHOW_TIME: "True"
          SHOW_TOTAL_CODE_TIME: "True"
